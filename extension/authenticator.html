<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WebAuthnLinux Authenticator</title>

    <style>
        html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body {
            box-sizing: border-box;
            width: 425px;
            height: 180px;
            margin: 0;
            margin-bottom: 20px;
            padding: 12px;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #383E42;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }

        h2 {
            color: lightgray;
            font-size: 24px;
            margin: 8px 0 4px 0;
        }

        .status {
            font-size: 14px;
            margin: 0 0 20px 0;
            font-weight: bold;
            color: lightgray;
        }

        .error {
            color: red;
        }

        #unlock-btn {
            display: none;
            padding: 10px 20px;
            font-size: 22px;
            cursor: pointer;
            color: whitesmoke;
            background-color: gray;
            border-radius: 12px;
            border: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>WebAuthnLinux Authenticator</h2>
    <div id="status" class="status">Waiting for requests...</div>
    <div id="action-area">
        <button id="unlock-btn">
            Unlock with Fingerprint
        </button>
    </div>

    <script src="js/cbor.js"></script>
    <script src="js/webauthn-tools.js"></script>
    <script src="js/falcon.js"></script>
    <script src="js/webauthn-authenticator.js"></script>
    <script src="authenticator.js"></script>
</body>

</html>
